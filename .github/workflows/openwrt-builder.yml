#
# 基于 P3TERX/Actions-OpenWrt 模板改造，源码指向 pbs05/ponwrt（Airoha AN758x PON）
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build PonWrt (Airoha AN7581 / AN7583) using GitHub Actions
#
# This is free software, licensed under the MIT License.
#

name: PonWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source:
        description: '编译源码仓库'
        required: true
        default: 'pbs05/ponwrt'
        type: choice
        options:
          - pbs05/ponwrt
          - fork
      branch:
        description: 'ponwrt 源码分支'
        required: true
        default: 'master'
      soc:
        description: 'SoC 平台'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583
      profile:
        description: '机型（常用机型直接选；all=该 SoC 全部机型）'
        required: true
        default: 'fiberhome_hg5585f-ct'
        type: choice
        options:
          # ---- an7581 ----
          - fiberhome_hg5585f-ct
          - fiberhome_hg5585f-cu
          - fiberhome_hg5585f-ct-usb-sfp
          - fiberhome_hg5585f-cu-usb-sfp
          - fiberhome_hg5382a
          - h3c_hm2004-du
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-md-ubi-usb-sfp
          - nokia_xg-040g-tf-ubi
          - nokia_valyrian
          - gemtek_xg2010g
          - gemtek_w1700k-ubi
          - unionman_ung00a
          - znxt_zn504xg-d
          - znxt_zn515xg-d
          - quantum_q1000k-ubi
          - airoha_an7581-evb-multievb
          # ---- an7583 ----
          - nokia_xg-040g-mf
          - nokia_xg-040g-mf-ubi
          - airoha_an7583-evb-multievb
          # ---- 全部 ----
          - all
      profile_custom:
        description: '机型（自定义，填了则覆盖上面的选择；一般留空）'
        required: false
        default: ''
      config_file:
        description: '使用的配置文件（一般留 auto）'
        required: false
        default: 'auto'
      upload_release:
        description: '发布到 Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      reuse_toolchain:
        description: '复用工具链（工具链没变就直接沿用缓存，省 20~40 分钟）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# =========================================================
# 机型表（与上面 profile 下拉的 options 一一对应，改机型时两处一起改）
#
#   an7581（17 个）:
#     airoha_an7581-evb-multievb   gemtek_w1700k-ubi       gemtek_xg2010g
#     nokia_valyrian               fiberhome_hg5382a      fiberhome_hg5585f-ct
#     fiberhome_hg5585f-cu         fiberhome_hg5585f-ct-usb-sfp
#     fiberhome_hg5585f-cu-usb-sfp znxt_zn515xg-d         znxt_zn504xg-d
#     unionman_ung00a              h3c_hm2004-du          nokia_xg-040g-md-ubi
#     nokia_xg-040g-md-ubi-usb-sfp quantum_q1000k-ubi     nokia_xg-040g-tf-ubi
#
#   an7583（3 个）:
#     airoha_an7583-evb-multievb   nokia_xg-040g-mf       nokia_xg-040g-mf-ubi
#
# ⚠ GitHub 的 choice 下拉不支持「选 an7583 时只显示 3 个」这种联动，
#   所以下拉里是两个 SoC 的机型全列出来。选错了 soc/profile 组合会在
#   「环境自检」step 里被拦下并列出该 soc 的可选值。
# ⚠ 上游新增机型时，这里和 profile.options 都要补，否则下拉里选不到。
# =========================================================

env:
  BUILD_ROOT: /workdir
  # fork 选项指你自己的镜像；上游走 pbs05/ponwrt
  SOURCE: ${{ github.event.inputs.source || 'pbs05/ponwrt' }}
  REPO_URL: ${{ github.event.inputs.source == 'fork' && 'https://github.com/jsntit/ponwrt' || 'https://github.com/pbs05/ponwrt' }}
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}

  FEEDS_CONF: ''
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  SOC: ${{ github.event.inputs.soc || 'an7581' }}
  # 机型：下拉选择优先，profile_custom 填了则覆盖（用于 all 之外的临时机型）
  PROFILE: ${{ github.event.inputs.profile_custom || github.event.inputs.profile || 'fiberhome_hg5585f-ct' }}
  CONFIG_NAME: ${{ github.event.inputs.config_file || 'auto' }}

  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: ${{ github.event.inputs.upload_release || 'true' }}
  # 复用工具链：true = 工具链没变就吃缓存（默认）；false = 忽略缓存强制重编工具链
  REUSE_TOOLCHAIN: ${{ github.event.inputs.reuse_toolchain || 'true' }}

  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


# GITHUB_TOKEN 权限显式声明：本仓库默认是 read（新建仓库的 GitHub 默认值），
# 不写这一段的话 release 上传会报 Resource not accessible by integration。
permissions:
  contents: write   # 建 release / 传 assets / 打 tag
  actions: write    # 删除旧 workflow run
jobs:
  build:
    # ponwrt 走 ImmortalWrt 主线（内核 6.18），用 24.04 而非模板默认的 22.04：
    # 22.04 的 gcc-11 / python3.10 编 6.18 内核与新版 host 工具时会踩坑
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: 环境自检
      run: |
        echo "=========================================="
        echo "PonWrt 构建参数"
        echo "=========================================="
        echo "Source    : ${SOURCE} (${REPO_URL})"
        echo "Branch    : ${REPO_BRANCH}"
        echo "SoC       : ${SOC}"
        echo "Profile   : ${PROFILE}"
        echo "Config    : ${CONFIG_NAME}"
        echo "Runner    : $(lsb_release -ds 2>/dev/null || echo unknown)"
        echo "=========================================="
        # 机型必须属于所选 SoC，否则后面 defconfig 会静默剔除 TARGET_DEVICE
        case "${SOC}" in
          an7581) ALLOWED="airoha_an7581-evb-multievb gemtek_w1700k-ubi gemtek_xg2010g nokia_valyrian fiberhome_hg5382a fiberhome_hg5585f-ct fiberhome_hg5585f-cu fiberhome_hg5585f-ct-usb-sfp fiberhome_hg5585f-cu-usb-sfp znxt_zn515xg-d znxt_zn504xg-d unionman_ung00a h3c_hm2004-du nokia_xg-040g-md-ubi nokia_xg-040g-md-ubi-usb-sfp quantum_q1000k-ubi nokia_xg-040g-tf-ubi all" ;;
          an7583) ALLOWED="airoha_an7583-evb-multievb nokia_xg-040g-mf nokia_xg-040g-mf-ubi all" ;;
          *) echo "::error::未知 SoC: ${SOC}（只支持 an7581 / an7583）"; exit 1 ;;
        esac
        ok=0
        for d in $ALLOWED; do [ "$d" = "${PROFILE}" ] && ok=1 && break; done
        if [ "$ok" != "1" ]; then
          echo "::error::profile '${PROFILE}' 不属于 ${SOC}，可选：$ALLOWED"
          exit 1
        fi

    - name: 编译环境准备
      # 与 Toolchain Builder 共用同一个 composite action，避免 apt 依赖列表两处各写一份
      uses: ./.github/actions/build-env
      with:
        tz: ${{ env.TZ }}

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        echo "上游提交: $(git rev-parse --short HEAD)"
        git log -1 --pretty=format:'  日期: %ci%n  标题: %s%n'

    - name: Load custom feeds
      run: |
        [ -n "$FEEDS_CONF" ] && [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        # 配置加载优先级：
        #   1) configs/<profile>.config   按机型的精细配置（自己调过就用这个）
        #   2) configs/<soc>.config       ponwrt 官方全量配置，机型由下一步收敛
        #   3) .config                    workspace 根目录的兜底
        CFG=""
        if [ "$CONFIG_NAME" = "auto" ]; then
          if [ -e "configs/${PROFILE}.config" ]; then
            CFG="configs/${PROFILE}.config"
          else
            CFG="configs/${SOC}.config"
          fi
        elif [ -n "$CONFIG_NAME" ]; then
          CFG="$CONFIG_NAME"
        fi

        if [ -n "$CFG" ] && [ -e "$CFG" ]; then
          cp "$CFG" openwrt/.config
          echo "✅ 已加载配置: $CFG"
        elif [ -e "$CONFIG_FILE" ] && [ "$(wc -l < "$CONFIG_FILE")" -gt 5 ]; then
          cp "$CONFIG_FILE" openwrt/.config
          echo "✅ 已加载配置: $CONFIG_FILE（configs/ 下没有 ${CFG}）"
        else
          echo "::error::找不到任何可用的配置（configs/${PROFILE}.config、configs/${SOC}.config、.config 都不存在）"
          exit 1
        fi

        # release.config：ponwrt 官方发布版的额外包（BBR / cake / tproxy / wireguard 等）
        # 以追加方式合并，已存在的同名符号以先出现的为准，所以放最后只补缺失项
        if [ -e configs/release.config ]; then
          echo "--- 叠加 configs/release.config 的额外包 ---"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            sym="${line%%=*}"
            grep -q "^${sym}=" openwrt/.config || echo "$line" >> openwrt/.config
          done < configs/release.config
        fi

        [ -e files ] && mv files openwrt/files
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: 强制目标平台与机型
      run: |
        cd openwrt
        # ponwrt 自带的 configs/an7581.config 是「多机型一起编」的，这里按输入的
        # profile 收敛成单机型。
        #
        # ============================================================
        # ⚠⚠ 这里有两套长得几乎一样、语义完全不同的 DEVICE 符号。搞混就是白调半天。
        #
        #   出自 scripts/target-metadata.pl（生成 tmp/.config-target.in）：
        #
        #   (A) choice "Target Profile" 的成员 —— 单选
        #         config TARGET_<conf>_<profile_id>
        #       → CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a
        #
        #       ⚠ 关键：choice "Target Profile" 里**还包含 TARGET_MULTI_PROFILE 自己**
        #         （target-metadata.pl 里 `config TARGET_MULTI_PROFILE` 就写在 choice 内），
        #         所以 (A) 与本步骤要用的 MULTI_PROFILE=y 是**互斥**的：
        #           · MULTI_PROFILE=y  → 所有 TARGET_<conf>_<profile> 全变 not set
        #           · 任一机型 =y      → MULTI_PROFILE 自动变 n
        #         两者同时写 → kconfig 打
        #           warning: override: TARGET_MULTI_PROFILE changes choice state
        #         并把其中一行抹掉。2026-11-09 run 42630582605 就死在这里：
        #         写了 MULTI_PROFILE=y 又写机型 =y → 机型行被抹 → 校验误报「机型没生效」。
        #
        #   (B) "Target Devices" 菜单里的选项 —— 多选，depends on TARGET_MULTI_PROFILE
        #         menuconfig TARGET_DEVICE_<conf>_<profile_id>
        #       → CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a
        #
        #   所以单机型走 (B)：MULTI_PROFILE=y + 只勾这一台。
        #   此时 (A) 必然是 not set —— **不要写它，也不要校验它**。
        # ============================================================
        #
        # 另外 `CONFIG_TARGET_airoha=y` 这条**必须**一起删掉再统一追加：
        #   它也是 choice 成员，原来 sed 的正则 `^CONFIG_TARGET_airoha_` 末尾是下划线，
        #   漏掉不带下划线的 `CONFIG_TARGET_airoha=y`，导致同符号出现两次、
        #   引发 `warning: override: TARGET_airoha changes choice state`。
        #   → 字符类用 [=_] 才能两种形式都命中。
        #
        # 只动这几组符号，别用 /^CONFIG_TARGET_/ 一刀切：
        # 那会连 TARGET_DEVICE_PACKAGES_* / TARGET_OPTIMIZATION / TARGET_PREINIT_*
        # 之类一起删掉，defconfig 重算后可能丢配置。
        #
        # ============================================================
        # ★ 单机型也必须走 (B) + PER_DEVICE_ROOTFS=y（对齐 Actions-OpenWrt-AN758X）
        #
        #   原来单机型把这三个都设成 n，后果是 include/image.mk 里这段整段不生效：
        #
        #     ifdef TARGET_PER_DEVICE_ROOTFS
        #       $(eval $(call merge_packages,_PACKAGES,$$(DEVICE_PACKAGES) \
        #              $$(call DEVICE_EXTRA_PACKAGES,$(1))))
        #     endif
        #
        #   → image/an7581.mk、an7583.mk 里每台设备的 DEVICE_PACKAGES（光口 BOSA、
        #     2.5G PHY、WiFi、USB、SFP、风扇、10G PHY 固件…）一个都不进固件，
        #     而且 defconfig **不报错、不告警**。表现就是「config 里看着都开了，
        #     刷进去却没有驱动」，只能靠手工把它们逐个改写成 =y 硬补。
        #
        #   现在：MULTI_PROFILE=y + PER_DEVICE_ROOTFS=y，只用
        #   CONFIG_TARGET_DEVICE_<conf>_DEVICE_<profile>=y 勾中这一台，
        #   并把 TARGET_DEVICE_PACKAGES_<conf>_DEVICE_<profile> 清空，
        #   让 image/*.mk 的清单原样生效。20 台设备各自拿自己的包，不再互相牵扯。
        # ============================================================
        sed -i -E "/^CONFIG_TARGET_airoha[=_]|^# CONFIG_TARGET_airoha[ =_]/d" .config
        sed -i -E "/^CONFIG_TARGET_DEVICE_|^# CONFIG_TARGET_DEVICE_/d" .config
        sed -i -E "/^CONFIG_TARGET_ALL_PROFILES|^# CONFIG_TARGET_ALL_PROFILES/d" .config
        sed -i -E "/^CONFIG_TARGET_MULTI_PROFILE|^# CONFIG_TARGET_MULTI_PROFILE/d" .config
        sed -i -E "/^CONFIG_TARGET_PER_DEVICE_ROOTFS|^# CONFIG_TARGET_PER_DEVICE_ROOTFS/d" .config

        {
          echo "CONFIG_TARGET_airoha=y"
          echo "CONFIG_TARGET_airoha_${SOC}=y"
          if [ "${PROFILE}" = "all" ]; then
            # all = 该 SoC 全部机型。
            # 走 (B) 多机型模式，choice (A) 留空让 kconfig 取 default 即可。
            echo "CONFIG_TARGET_ALL_PROFILES=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"
          else
            # ★ 这里**不能**写 CONFIG_TARGET_<soc>_DEVICE_<profile>=y。
            #
            #   target-metadata.pl 里 choice "Target Profile" 是这样生成的：
            #     choice
            #       prompt "Target Profile"
            #       default TARGET_MULTI_PROFILE if BUILDBOT
            #     config TARGET_MULTI_PROFILE
            #       bool "Multiple devices"
            #   —— TARGET_MULTI_PROFILE 本身就是这个 choice 的成员。
            #   先写 MULTI_PROFILE=y 再写机型 =y，两者抢同一个 choice，
            #   kconfig 会打：
            #     warning: override: TARGET_MULTI_PROFILE changes choice state
            #   并把机型那行抹成 not set。2026-11-09 run 42630582605 就是这么挂的。
            #
            #   单机型只靠 (B) 就够：image.mk:570 的 DEVICE_CHECK_PROFILE 在
            #   MULTI_PROFILE=y 时只读 CONFIG_TARGET_DEVICE_*，没勾中的机型
            #   _PROFILE_SET 为空 → _TARGET = install-disabled，不会编进去。
            echo "CONFIG_TARGET_ALL_PROFILES=n"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"
            # (B) 里只勾这一台
            echo "CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y"
            # 清空 per-device 的包覆盖，让 image/*.mk 的 DEVICE_PACKAGES 原样生效
            echo "CONFIG_TARGET_DEVICE_PACKAGES_airoha_${SOC}_DEVICE_${PROFILE}=\"\""
          fi
        } >> .config

        # 写前自检：这些符号在 .config 里必须各有且只有 1 处。
        # 重复会让 kconfig 按「最后一个生效」，含义完全不可控。
        echo "--- 追加后符号唯一性检查 ---"
        for sym in \
          "CONFIG_TARGET_airoha" \
          "CONFIG_TARGET_airoha_${SOC}"
        do
          n=$(grep -cE "^${sym}=" .config || true)
          echo "  ${sym} = ${n} 处"
          if [ "${n}" -ne 1 ]; then
            echo "::error::${sym} 在 .config 里出现 ${n} 次（应为 1 次）—— sed 清理没删干净"
            grep -nE "^${sym}=" .config
            exit 1
          fi
        done

        echo "✅ 已锁定 target: airoha/${SOC}  device: ${PROFILE}（choice 成员：CONFIG_TARGET_airoha_${SOC}_DEVICE_${PROFILE}）"
        # defconfig 输出留档：后面要检查有没有 choice state 冲突。
        # `set -e` 下用 || 显式处理，避免失败被吞掉。
        DC_LOG="${RUNNER_TEMP}/defconfig.log"
        if ! make defconfig > "${DC_LOG}" 2>&1; then
          echo "::error::make defconfig 失败"
          tail -80 "${DC_LOG}" | sed 's/^/::error::  /'
          exit 1
        fi
        grep -E "^(CONFIG_|# CONFIG_)" "${DC_LOG}" >/dev/null 2>&1 || true
        tail -5 "${DC_LOG}"
        echo "--- defconfig 之后的实际选择 ---"
        grep -E "^CONFIG_TARGET_(airoha|DEVICE|ALL_PROFILES|MULTI_PROFILE|PER_DEVICE_ROOTFS)" .config || true

        # 任何 "changes choice state" 都说明 .config 里给同一个 choice 写了两个成员。
        # 这种冲突 kconfig 只 warning 不报错，代价是符号被静默抹掉 —— 必须拦下。
        if grep -q "changes choice state" "${DC_LOG}"; then
          echo "::error::defconfig 出现 choice state 冲突（同一 choice 写了多个成员）"
          grep -n -B2 "changes choice state" "${DC_LOG}" | sed 's/^/::error::  /'
          echo "::error::常见原因：同时写了 CONFIG_TARGET_MULTI_PROFILE=y 和 CONFIG_TARGET_<soc>_DEVICE_<profile>=y"
          exit 1
        fi

        if [ "${PROFILE}" != "all" ]; then
          # 设备包能否合并进 rootfs，取决于下面两个符号。任何一个被 defconfig
          # 重置，固件就会悄悄少驱动 —— 必须硬校验。
          if ! grep -q "^CONFIG_TARGET_MULTI_PROFILE=y" .config; then
            echo "::error::MULTI_PROFILE 没生效，设备选择与设备包合并都会失效"
            exit 1
          fi
          if ! grep -q "^CONFIG_TARGET_PER_DEVICE_ROOTFS=y" .config; then
            echo "::error::PER_DEVICE_ROOTFS 没生效，image/*.mk 的 DEVICE_PACKAGES 会被丢弃"
            exit 1
          fi

          # 单机型在 MULTI_PROFILE=y 下由 (B) 决定编哪台。
          # choice (A) CONFIG_TARGET_<soc>_DEVICE_<profile> 此时必然是 not set，
          # 不要再校验它（那是 42630582605 失败的直接原因）。
          if ! grep -q "^CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y" .config; then
            echo "::error::设备没被选中: CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y"
            echo "::error::实际勾中的设备:"
            grep -oE "^CONFIG_TARGET_DEVICE_airoha_[A-Za-z0-9]+_DEVICE_[A-Za-z0-9_.-]+=y" .config \
              | sed 's/^/::error::  /' || true
            echo "::error::上面没有输出时，多半是 PROFILE 名与 image/${SOC}.mk 里 define Device/<name> 不一致"
            exit 1
          fi

          # 反向校验：只允许这一台。多勾了会一起编，白烧 runner。
          EXTRA=$(grep -oE "^CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_[A-Za-z0-9_.-]+=y" .config \
            | sed 's/.*_DEVICE_//; s/=y$//' | grep -vx "${PROFILE}" || true)
          if [ -n "${EXTRA}" ]; then
            echo "::error::除 ${PROFILE} 外还勾中了: ${EXTRA}（会被一起编进固件）"
            exit 1
          fi

          echo "✅ MULTI_PROFILE=y / PER_DEVICE_ROOTFS=y / (B) 命中 ${PROFILE} —— DEVICE_PACKAGES 会合进 rootfs"
        else
          echo "✅ 多机型模式（all）：MULTI_PROFILE=y"
        fi

    # =========================================================
    # 关键包校验
    #
    # `make defconfig` 对「依赖不满足」和「符号不存在」都是**静默剔除**：
    # 不报错、不告警，只是把 =y 抹掉，编完才发现固件里少个菜单。
    # 这是唯一能提前发现的地方。
    #
    # 改插件时**必须同步改这里**：
    #   - 列表里只写本次真正启用的包。没装的留在列表里，这一步必然 exit 1。
    #   - 下面「必须不存在」的列表用来防撞车。
    # =========================================================
    # =========================================================
    # 校验关键包
    #
    # 清单**按分支维护**，在 .github/required-packages.txt：
    #   每行一个包名；`!name` 表示必须**不**启用；# 开头为注释。
    #
    # 为什么不在 workflow 里硬编码：本文件三分支共用，但插件组合不同
    #   main          → 只有 luci-app-airoha-npu
    #   for-zhangbin  → frpc / zerotier / homeproxy / gecoosac
    #   for-maym      → homeproxy / tailscale(whzhni1) / curl
    # 硬编码只能对某一个分支成立。2026-11-09 的 run 42582299806 就是惨案：
    # for-zhangbin 被要求提供它根本没有的 luci-app-tailscale / curl / libcurl，
    # 6 分钟就死在 defconfig 之后。
    # =========================================================
    - name: 校验关键包
      run: |
        LIST="${{ github.workspace }}/.github/required-packages.txt"
        if [ ! -f "$LIST" ]; then
          echo "::error::缺少 ${LIST}（每个分支必须各有一份）"
          exit 1
        fi
        echo "清单: $LIST"

        CLEAN="$(mktemp)"
        sed 's/#.*//' "$LIST" | tr -d ' \t\r' | grep -v '^$' > "$CLEAN" || true
        echo "--- 本分支期望 ---"
        cat "$CLEAN"

        cd openwrt
        MISS=""
        BAD=""
        OK=""
        while IFS= read -r p; do
          if [ -z "$p" ]; then
            continue
          fi
          case "$p" in
            \!*)
              q="${p#!}"
              if grep -q "^CONFIG_PACKAGE_${q}=y" .config; then
                echo "::error::${q} 不应启用（清单里带 ! 前缀）"
                BAD="$BAD $q"
              fi
              ;;
            *)
              if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
                OK="$OK $p"
              else
                MISS="$MISS $p"
              fi
              ;;
          esac
        done < "$CLEAN"
        rm -f "$CLEAN"

        if [ -n "$MISS" ]; then
          echo "::error::defconfig 之后这些包没有生效:$MISS"
          echo "::error::先排除「清单写了本分支没有的包」——检查 .github/required-packages.txt"
          echo "::error::再排查依赖不满足 / 源码没拉到（diy-part1.sh 的 clone 段与开关）"
          exit 1
        fi
        if [ -n "$BAD" ]; then
          exit 1
        fi
        echo "✅ 关键包校验通过:$OK"

        # ---- 预启动（failsafe）地址校验 ----
        # diy-part2.sh 在 defconfig **之前**把 CONFIG_TARGET_PREINIT_IP 写成 10.0.0.1，
        # 但 defconfig 是「按 Kconfig 重算」的，万一它按 default 改回 192.168.1.1，
        # 只有等编完解包才会发现（白烧两小时）。这里是编译前最后一道闸。
        #
        # 期望值外置到 .github/expected-lan-ip.txt，按分支各写各的：
        # for-maym 写 10.0.0.1 —— 没有这个文件就整段跳过，不会误伤别的分支。
        IPF="${{ github.workspace }}/.github/expected-lan-ip.txt"
        if [ -f "$IPF" ]; then
          WANT=$(sed -e 's/#.*//' "$IPF" | tr -d ' \t\r' | grep -v '^$' | head -1 || true)
          GOT=$(sed -n 's/^CONFIG_TARGET_PREINIT_IP="\(.*\)"$/\1/p' .config | head -1)
          BCAST=$(sed -n 's/^CONFIG_TARGET_PREINIT_BROADCAST="\(.*\)"$/\1/p' .config | head -1)
          echo "预启动 IP：期望 ${WANT} / 实际 ${GOT}（broadcast ${BCAST}）"
          if [ -z "$WANT" ]; then
            echo "::error::$IPF 里没读到期望 IP"
            exit 1
          fi
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::defconfig 之后 CONFIG_TARGET_PREINIT_IP='${GOT}'，期望 '${WANT}'"
            echo "::error::这样刷进去 failsafe 还是老网段，进不去。检查："
            echo "::error::  1) diy-part2.sh 第 3/3b 段是否都执行了（往上翻「failsafe 预启动地址 ->」和「image-config.in」两行）"
            echo "::error::  2) 最常见根因：CONFIG_IMAGEOPT / CONFIG_PREINITOPT 都是 not set，"
            echo "::error::     → TARGET_PREINIT_IP 这个符号不可见 → defconfig 按 Kconfig default 重算，"
            echo "::error::     .config 里写什么都会被抹掉。必须改 package/base-files/image-config.in 的 default。"
            echo "::error::  3) 只改 .config / configs/*.config 是**没用的**，别在这上面反复试"
            exit 1
          fi
          echo "✅ failsafe 预启动地址 = ${GOT}/24"
        fi

    # =========================================================
    # 工具链缓存
    #
    # OpenWrt 的工具链只取决于「GCC 版本 + libc + binutils + toolchain/ 目录内容」，
    # 与机型（TARGET_DEVICE）无关：an7581 和 an7583 用的是同一套
    # aarch64_cortex-a53 / musl / gcc-14.4.0 工具链。实测两个 config 的
    # CONFIG_GCC_VERSION / BINUTILS_VERSION / LIBC / TARGET_SUFFIX 完全一致。
    #
    # 所以 key 用「工具链指纹」而不是 run_id：
    #   指纹不变 → 直接命中缓存 → 跳过工具链和 tools 的编译（省 20~40 分钟）
    #   指纹变了 → 落空 → 正常编译，编完把新的存回去
    #
    # 缓存内容 = 三块（缺一不可）：
    #   staging_dir/host                         tools/ 的 stamp 在这里
    #   staging_dir/toolchain-*                 工具链本体 + .gcc_final_installed 戳
    #   build_dir/toolchain-*                   工具链中间产物
    # stamp 跟着缓存一起回来，make 就认为工具链已完成，不会重编。
    # =========================================================

    - name: 计算工具链指纹
      id: tc
      run: |
        # 必须用共用脚本 —— Toolchain Builder 也用同一份，
        # 两边算法一旦分叉，cache key 就对不上，工具链永远命中不了。
        bash "$GITHUB_WORKSPACE/.github/scripts/toolchain-fingerprint.sh" /workdir/openwrt

    - name: 恢复工具链缓存
      id: tc_cache
      if: env.REUSE_TOOLCHAIN == 'true'
      # v5 = Node 24 运行时。v4 跑在 Node 20 上，而 Node 20 已被 GitHub 弃用，
      # 会被强制降级到 24 执行并每步打警告。本仓库统一钉 v5，不写 @main
      # （main 已迁到 v6 的 ESM 实现，引用会漂移、不可复现）。
      uses: actions/cache/restore@v5
      with:
        # 四块一起存：
        #   staging_dir/host      ← tools 装出来的宿主工具（ccache/gcc 包装等）
        #   staging_dir/toolchain-* ← 交叉工具链产物 + stamp
        #   build_dir/toolchain-*  ← 工具链编译目录（含 .built 戳记）
        #   build_dir/host         ← tools 编译目录（含 .built 戳记）★ v2 新增
        #
        # 为什么必须带 build_dir/host：tools 的「已编译」判定只看
        # build_dir/host/<pkg>/.built。只恢复 staging_dir/host 而没有戳记，
        # make 会把 30 多个 tools 全部重编（实测 19.9 分钟），
        # 编完刷新 staging_dir/host/stamp/.tools_compile_* →
        # 而 toolchain/compile 依赖 $(tools/stamp-compile) → 工具链被判为要重编
        # （实测又 26.2 分钟）。也就是说少了 build_dir/host，
        # 「工具链缓存命中」其实是假的，白烧 46 分钟。
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/toolchain-*
          /workdir/openwrt/build_dir/host
        key: toolchain-v3-${{ steps.tc.outputs.fingerprint }}
        # 兜底顺序 v2 → v1：
        #   v2 = 内容齐（含 build_dir/host），但戳记只推到「现在」→ 命中后仍会重编
        #   v1 = 只有 staging_dir，连 build_dir/host 都没有
        # v3 与 v2 的内容完全一样，唯一区别是编译前会把戳记推到未来，
        # 所以「前缀命中 v2」这一次不会重编，编完直接存成 v3；
        # 之后三个分支都精确命中 v3，不再有任何前缀命中。
        restore-keys: |
          toolchain-v2-${{ steps.tc.outputs.fingerprint }}
          toolchain-${{ steps.tc.outputs.fingerprint }}

    - name: 修正缓存恢复出来的时间戳
      # 源码是本次刚 clone 的（mtime = 现在），而缓存里的戳记 mtime 是几天前。
      # make 按「prereq 比 target 新就重编」判断，于是会认为源码更新过 → 全部重编。
      #
      # 分两批 touch：
      #   第 1 批 普通文件（源码/对象文件）      → 现在
      #   第 2 批 戳记（stamp/、.built、.prepared…）→ 未来（now + 6h）
      #
      # ★ 第 2 批必须推到「未来」，不是「现在」。原因：
      #
      #     tools/Makefile:
      #       $(STAGING_DIR)/.prepared: $(TMP_DIR)/.build
      #     toolchain/Makefile:
      #       $(curdir)//compile = $(STAGING_DIR)/.prepared $(TOOLCHAIN_DIR)/info.mk $(tools/stamp-compile)
      #
      #   tmp/ 不在缓存里，每次 make 都新建，tmp/.build 的 mtime = 本次构建开始时刻，
      #   永远比 touch 到「现在」的 .prepared 新 → .prepared 规则重跑 →
      #   $(curdir)//compile 的 prereq 变新 → 判定工具链要重编（实测 26.4 分钟）。
      #   2026-11-10 run 42821007026 就是这样：日志里「Cache hit 1148MB」之后
      #   照样跑了 toolchain/gcc/initial + final 共 22 分钟。
      #
      #   把 .prepared 推到 now+6h 之后，它永远比 tmp/.build 新，这条链就断了。
      #   6 小时是安全余量：实测整条构建最长 3h12m（run 42821007026）。
      #
      # ★ 第 2 批必须用同一个**绝对**时间，不能分几次 `touch -d now+X`。
      #   否则 .prepared 可能比 .gcc_final_installed 晚几微秒 → 又触发重编。
      #   make 只在 prereq **严格更新** 时才重编，时间完全相同是安全的。
      #
      # 用 cache-matched-key 而不是 cache-hit：restore-keys 前缀命中时
      # cache-hit 是 'false'，但确实恢复了东西，也需要 touch。
      if: env.REUSE_TOOLCHAIN == 'true' && steps.tc_cache.outputs.cache-matched-key != ''
      run: |
        cd /workdir/openwrt
        DIRS="staging_dir/host build_dir/host"
        for d in staging_dir/toolchain-* build_dir/toolchain-*; do [ -d "$d" ] && DIRS="$DIRS $d"; done

        FUT=$(date -d 'now + 6 hours' '+%Y-%m-%d %H:%M:%S')
        echo "戳记统一推到: ${FUT}"

        echo "--- touch 前 ---"
        ls -ld --time-style=+%F_%T staging_dir/host/stamp/.tools_compile_* 2>/dev/null | head -3 || true

        # 第 1 批：非戳记文件 → 现在
        find $DIRS -type f \
          ! -path '*/stamp/*' ! -name '.built*' ! -name '.configured*' \
          ! -name '.prepared*' ! -name '.installed*' \
          -exec touch -h {} + 2>/dev/null || true

        # 第 2 批：戳记 → 未来同一个时刻
        find $DIRS \( -path '*/stamp/*' -o -name '.built*' -o -name '.configured*' \
             -o -name '.prepared*' -o -name '.installed*' \) \
          -exec touch -h -d "$FUT" {} + 2>/dev/null || true

        # staging_dir/.prepared 不在 DIRS 里（DIRS 只有 staging_dir/host/*），单独补。
        # 它正是 tools/Makefile 里 $(STAGING_DIR)/.prepared: $(TMP_DIR)/.build 的目标。
        for f in staging_dir/.prepared staging_dir/host/.prepared; do
          if [ -e "$f" ]; then
            touch -h -d "$FUT" "$f"
            echo "✅ 已推到未来: $f"
          else
            echo "::warning::$f 不存在（tools 大概没编完过，tools 阶段会重跑）"
          fi
        done

        echo "--- touch 后 ---"
        ls -ld --time-style=+%F_%T staging_dir/host/stamp/.tools_compile_* 2>/dev/null | head -3 || true
        ls -ld --time-style=+%F_%T staging_dir/.prepared 2>/dev/null || true
        echo "✅ tools 戳记: $(ls staging_dir/host/stamp/.tools_compile_* 2>/dev/null | wc -l) 个"
        echo "✅ host 编译戳记: $(find build_dir/host -name '.built' 2>/dev/null | wc -l) 个"
        echo "✅ 工具链完成戳: $(ls staging_dir/toolchain-*/stamp/.gcc_final_installed 2>/dev/null | wc -l) 个"

    - name: 工具链复用结果
      run: |
        KEY="toolchain-v3-${{ steps.tc.outputs.fingerprint }}"
        MATCHED="${{ steps.tc_cache.outputs.cache-matched-key }}"
        HIT="${{ steps.tc_cache.outputs.cache-hit }}"
        TOOLS_STAMP=$(ls /workdir/openwrt/staging_dir/host/stamp/.tools_compile_* 2>/dev/null | wc -l)

        if [ "$REUSE_TOOLCHAIN" != "true" ]; then
          echo "::notice::已选择「不复用工具链」，本次将从头编译工具链（会慢 20~40 分钟）"
          STATE="不复用（手动关闭）"
        elif [ -z "$MATCHED" ]; then
          echo "::warning::工具链缓存未命中，本次会顺带把工具链一起编了（多花 20~40 分钟）"
          echo "::notice::下次想省这段时间：先去跑 Toolchain Builder，它会单独把 $KEY 编好存起来"
          STATE="未命中，本次随固件一起编译"
        elif [ "$HIT" = "true" ]; then
          echo "::notice::工具链缓存精确命中（$KEY），tools 和工具链都跳过"
          STATE="精确命中，tools + 工具链均跳过"
        else
          # restore-keys 兜底到旧版缓存：工具链在，但 tools 的 build_dir 可能缺
          echo "::notice::工具链缓存前缀命中（$MATCHED），非当前版本"
          STATE="前缀命中 \`$MATCHED\`"
        fi

        if [ "$TOOLS_STAMP" -gt 0 ]; then
          echo "✅ tools 完成戳 $TOOLS_STAMP 个 → tools 阶段会被跳过"
        else
          echo "::warning::没有 tools 完成戳，本次会重编全部 tools（约 20 分钟）"
        fi
        ls /workdir/openwrt/staging_dir/toolchain-*/stamp/.gcc_final_installed 2>/dev/null \
          && echo "✅ 工具链完成戳已恢复" \
          || echo "::warning::没找到 .gcc_final_installed，工具链可能会重编"

        {
          echo "### 工具链"
          echo ""
          echo "- 指纹：\`${{ steps.tc.outputs.fingerprint }}\`"
          echo "- 状态：$STATE"
          echo "- tools 完成戳：${TOOLS_STAMP} 个"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 计算下载缓存 key
      id: dlkey
      run: |
        # 不用 ${{ hashFiles('openwrt/.config') }}：源码在 /workdir，
        # workspace 里只有一个符号链接，hashFiles 走软链不可靠，可能返回空串
        # → key 退化成 "dl-"，所有配置共用一个缓存。
        #
        # ⚠ 也不能直接 md5sum 整个 .config。
        #   make defconfig 会给 feeds 里每个包都写一行
        #   「# CONFIG_PACKAGE_xxx is not set」，而 feeds 每天从上游拉新、包会增删，
        #   这一行也跟着增删 → 哈希漂移 → key 每次构建都不一样。
        #   实测 2026-11-11：同一份 configs/*.config、只改了 workflow，
        #   包数 2084 → 2082，key 连续三次全变，dl 缓存命中率归零，
        #   每次都白下 4~5 分钟，还把 10 GB 配额堆满。
        #   只取「真正生效的设置」（非注释、非空行）即可：上游增删包不影响 key，
        #   只有自己加减包或改目标平台时才换 key。
        H=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' /workdir/openwrt/.config \
            | sort | md5sum | cut -c1-16)
        echo "hash=$H" >> "$GITHUB_OUTPUT"
        echo "下载缓存 key: dl-$H"

    - name: 缓存下载目录
      uses: actions/cache@v5
      with:
        # dl/ 里全是上游的源码 tar 包。命中时省下 make download 的 2~4 分钟
        # （实测 2.1 / 4.3 分钟），网络差的时候更值。
        #
        # key 用「生效设置」的哈希：
        #   · 上游 feeds 增删包（只影响注释行）不会让它变 → 命中率稳定
        #   · 自己加减包 / 换目标 → key 变，重新下载并重建缓存
        #   · 不会像「每次 run_id」那样把缓存堆爆（10 GB 限额）
        # 用 actions/cache@v5（单步）而不是 restore/save 分离：
        # miss 时它自己会在 job 结束时存，hit 时不动，不需要额外步骤。
        path: /workdir/openwrt/dl
        key: dl-${{ steps.dlkey.outputs.hash }}
        # 换算法后旧 key（dl-<整个 .config 的 md5>）算出来对不上。
        # 前缀 dl- 兜底能捞到同分支最近一条旧缓存：作用域只有「当前分支 + 默认分支」，
        # 捞到的必然是同一套配置的 dl，最多差几个包，make download 会补齐。
        # 所以换算法不用先删缓存：第一次命中旧 key，编完自动存成新 key。
        restore-keys: |
          dl-

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        echo "--- 小于 1KB 的残缺文件（通常是下载失败）---"
        # ⚠ 必须限深 -maxdepth 1 且 -type f。
        #   dl/ 下除了下载的源码包，还有 go-mod-cache/ —— Go 模块解压出来的源码树，
        #   里面 internal/ util/ types/ 这类目录下大量 .go 文件只有几百字节。
        #   不限深就会把它们全删掉，之后 Go 包（sing-box 等）报
        #   "no required module provides package xxx"，0.58 秒就"编完"再失败。
        #   run 42932016902 正是这么挂的：dl 缓存命中 → 恢复出完整 go-mod-cache
        #   → 这一步把它删残 → sing-box 1.14.3 编译失败。
        find dl -maxdepth 1 -type f -size -1024c -printf '%s\t%p\n' -exec rm -f {} + || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"
        # 只认「设备选择」行：CONFIG_TARGET_DEVICE_<conf>_DEVICE_<profile>=y
        # 旧写法 '^CONFIG_TARGET.*DEVICE.*=y' 会把 CONFIG_TARGET_PER_DEVICE_ROOTFS=y 也匹配进来，
        # 被 sed 抠成 "ROOTFS"，DEVICE_NAME 变成两行 → $GITHUB_ENV 报 Invalid format '<机型>'，
        # make 明明成功、整个 step 仍判失败，产物名退化成 PonWrt_firmware_ROOTFS。
        grep -oE '^CONFIG_TARGET_DEVICE_[A-Za-z0-9_]+_DEVICE_[A-Za-z0-9_.-]+=y' .config \
          | sed -r 's/^CONFIG_TARGET_DEVICE_.*_DEVICE_(.*)=y$/\1/' \
          | paste -sd'+' - > DEVICE_NAME || true
        DN="$(cat DEVICE_NAME 2>/dev/null | tr -d '\r\n')"
        [ -n "${DN}" ] || DN="${PROFILE}"
        echo "DEVICE_NAME=_${DN}" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Save toolchain cache
      # 保存条件 = 「key 没有精确存在」（cache-hit != 'true'）。
      #
      # ★ 这一条同时覆盖了「前缀命中也要回写」，这正是 v3 迁移能落地的关键：
      #   restore-keys 兜底到 v2/v1 时 cache-hit 是 'false' —— 虽然恢复了东西，
      #   但那是旧版内容（戳记只推到「现在」，命中后仍会重编）。
      #   本次编完必须存一份 v3，之后三个分支才能精确命中。
      #   反过来说，v3 已精确存在时再存毫无意义（同 key 不可覆盖），
      #   真要强制重建就升 v4，或者用 Toolchain Builder 的 force_rebuild。
      #
      # ⚠ 必须再要求「指纹非空」。
      #   前面的「强制目标平台与机型」一旦失败，后面的「计算工具链指纹」就是
      #   skipped，steps.tc.outputs.fingerprint 取不到值 → 展开成空串，
      #   而这里用的是 always()，于是会存出一个 key 为 `toolchain-` 的空缓存
      #   （实测 12880 字节、只有目录骨架），把分支的缓存命名空间污染掉。
      if: >-
        always() && env.REUSE_TOOLCHAIN == 'true'
        && steps.tc.outcome == 'success'
        && steps.tc.outputs.fingerprint != ''
        && steps.tc_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        # 与 restore 的 path / key 必须逐项一致（含 build_dir/host）
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/toolchain-*
          /workdir/openwrt/build_dir/host
        key: toolchain-v3-${{ steps.tc.outputs.fingerprint }}

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: PonWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: PonWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        {
          echo "PonWrt ${SOC} / ${PROFILE}"
          echo ""
          echo "- 源码: ${SOURCE}@${REPO_BRANCH}"
          echo "- SoC: \`${SOC}\`"
          echo "- 机型: \`${PROFILE}\`"
          echo "- 构建: $(date +'%Y-%m-%d %H:%M:%S %Z')"
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      if: (!cancelled())
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    # 原来用 dev-drprasad/delete-older-releases@master，但它的 action.yml
    # 至今还是 `using: node20` → 每次发版都吃一条 Node 20 弃用警告。
    # 上游长期没跟进，改成 runner 自带的 gh CLI，行为等价：
    #   keep_latest: 3  → 只留最新 3 个
    #   delete_tags: true → --cleanup-tag 连 tag 一起删
    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "现有 release："
        gh release list --limit 100
        # 落文件再 while read：管道会进子 shell；且 `[ -z "$x" ] && continue`
        # 在 bash -e 下整条返回 1 会直接杀脚本，必须写成 if。
        gh release list --limit 100 --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' > /tmp/old-tags.txt
        while IFS= read -r tag; do
          if [ -z "$tag" ]; then
            continue
          fi
          echo "删除旧 release: $tag"
          gh release delete "$tag" --yes --cleanup-tag || echo "警告：$tag 删除失败，跳过"
        done < /tmp/old-tags.txt
