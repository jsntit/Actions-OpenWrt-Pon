#
# 单独编译工具链（不编固件）
#
# 用途：把最贵的那一段（tools/ + binutils + gcc + libc + 内核头文件，约 20~40 分钟）
#       单独跑一次，结果存进仓库级 cache。之后固件构建（openwrt-builder.yml）
#       直接命中缓存跳过这一段。
#
# 为什么这两个 workflow 能互通：
#   GitHub Actions 的 cache 是「仓库级」的 —— 不是按 workflow 隔离。
#   只要两边用同一份指纹算法（.github/scripts/toolchain-fingerprint.sh），
#   key 就一致，固件构建能直接 restore 这里存下的东西。
#
# 什么时候需要跑：
#   - 上游升了 GCC / binutils / libc
#   - 上游改了 toolchain/ 目录里的任何文件
#   - cache 被驱逐了（7 天未访问 / 超出容量），固件构建提示未命中
#
name: Toolchain Builder

on:
  workflow_dispatch:
    inputs:
      source:
        description: '编译源码仓库'
        required: true
        default: 'pbs05/ponwrt'
        type: choice
        options:
          - pbs05/ponwrt
          - fork
      branch:
        description: 'ponwrt 源码分支'
        required: true
        default: 'master'
      soc:
        description: '用哪个 SoC 的官方配置（工具链与机型无关，选哪个结果都一样）'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583
      force_rebuild:
        description: '强制重编（忽略已有缓存）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 查 cache 列表需要 actions:read
permissions:
  actions: read
  contents: read

env:
  # fork 选项指你自己的 ponwrt 镜像
  REPO_URL: ${{ github.event.inputs.source == 'fork' && 'https://github.com/jsntit/ponwrt' || 'https://github.com/pbs05/ponwrt' }}
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  SOC: ${{ github.event.inputs.soc || 'an7581' }}
  FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  toolchain:
    name: 编译工具链
    # 与固件构建保持同一 runner：工具链产物要和那边的环境完全一致
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: 参数自检
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=========================================="
        echo "工具链编译参数"
        echo "=========================================="
        echo "源码    : ${REPO_URL} (${REPO_BRANCH})"
        echo "基准 SoC: ${SOC}"
        echo "强制重编: ${FORCE_REBUILD}"
        echo "当前分支: ${GITHUB_REF_NAME}"
        echo "Runner  : $(lsb_release -ds 2>/dev/null || echo unknown)"
        echo "=========================================="
        case "${SOC}" in
          an7581|an7583) ;;
          *) echo "::error::不支持的 SoC: ${SOC}"; exit 1 ;;
        esac
        if [ ! -e "configs/${SOC}.config" ]; then
          echo "::error::找不到 configs/${SOC}.config —— 无法确定 GCC 版本"
          exit 1
        fi

        # cache 的可见性按分支隔离：一个 run 能读「当前分支」和「默认分支」的 cache。
        # 所以在默认分支（main）上跑，存下的工具链所有分支都能用；
        # 在别的分支上跑，只有那个分支能用，等于白编。
        DEFAULT_BRANCH=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r '.default_branch // "main"')
        echo "默认分支: ${DEFAULT_BRANCH}"
        if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
          echo "::warning::当前分支不是默认分支 —— cache 只对 ${GITHUB_REF_NAME} 可见，其他分支（含 ${DEFAULT_BRANCH}）用不上。想让大家共用，请在 ${DEFAULT_BRANCH} 上跑。"
        fi

    - name: 编译环境准备
      uses: ./.github/actions/build-env
      with:
        tz: ${{ env.TZ }}

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
        cd openwrt
        echo "上游提交: $(git rev-parse --short HEAD)"
        git log -1 --pretty=format:'  日期: %ci%n  标题: %s%n'

    - name: Load feeds
      run: |
        cd /workdir/openwrt
        # 工具链本身不依赖 feeds，但这里仍然跑一遍：
        # 保证 .config 展开结果和固件构建那边完全一致，避免任何细微差异。
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 载入基准配置
      run: |
        cd /workdir/openwrt
        cp "$GITHUB_WORKSPACE/configs/${SOC}.config" .config
        echo "✅ 已载入 configs/${SOC}.config"
        make defconfig
        echo "--- 工具链参数 ---"
        grep -E "^CONFIG_(GCC_VERSION|BINUTILS_VERSION|LIBC|TARGET_SUFFIX|ARCH|CPU_TYPE)=" .config

    - name: 计算工具链指纹
      id: tc
      run: |
        # 与固件构建共用同一份脚本 —— 两边的 cache key 必须一致
        bash "$GITHUB_WORKSPACE/.github/scripts/toolchain-fingerprint.sh" /workdir/openwrt

    - name: 检查是否已有缓存
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # ⚠ 必须和 restore/save 用同一个 key 前缀（v3），
        #   否则这条会看到旧版缓存存在 → 判定「无需重编」→ v3 永远建不起来。
        KEY="toolchain-v3-${{ steps.tc.outputs.fingerprint }}"
        echo "要查的 key: $KEY"

        if [ "$FORCE_REBUILD" = "true" ]; then
          echo "::notice::已选择强制重编，跳过缓存检查"
          echo "need_build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # REST 的 key 参数是「前缀匹配」，所以拿回来还要精确比对
        CNT=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=${KEY}&per_page=100" \
              | jq -r --arg k "$KEY" '[.actions_caches[]? | select(.key == $k)] | length')

        if [ "${CNT:-0}" -gt 0 ]; then
          echo "::notice::缓存已存在（$KEY），无需重编。要强制重编请把 force_rebuild 选成 true"
          echo "need_build=false" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::没有找到缓存，开始编译工具链"
          echo "need_build=true" >> "$GITHUB_OUTPUT"
        fi

    - name: 恢复工具链缓存
      id: restore
      # ⚠ 必须在「编译工具链」之前。
      #   原来这个步骤排在第 10 位（build 之后），等于编译时工作区里根本没有缓存，
      #   每次都从零编 tools + toolchain（46 分钟），restore 只起到「给 save 垫底」的作用。
      #
      #   无条件恢复：命中就省时间；没命中 restore 也只是 no-op
      #   （fail-on-cache-miss 默认 false）。
      uses: actions/cache/restore@v5
      with:
        # 与 openwrt-builder.yml 的 restore 逐项一致，否则固件构建永远命不中
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/toolchain-*
          /workdir/openwrt/build_dir/host
        key: toolchain-v3-${{ steps.tc.outputs.fingerprint }}
        # v2（内容齐，但戳记只推到「现在」）→ v1（只有 staging_dir）依次兜底。
        # 前缀命中 v2 时，下面的「修正缓存时间戳」会把戳记推到未来，
        # 于是工具链不会重编，编完直接存成 v3。
        restore-keys: |
          toolchain-v2-${{ steps.tc.outputs.fingerprint }}
          toolchain-${{ steps.tc.outputs.fingerprint }}

    - name: 修正缓存时间戳
      # 源码刚 clone（mtime=现在），缓存里的戳记是几天前 → make 会判定全部要重编。
      #
      # 第 2 批必须推到「未来」，理由与 openwrt-builder.yml 同一段注释：
      #   tools/Makefile 的 $(STAGING_DIR)/.prepared: $(TMP_DIR)/.build
      #   tmp/ 不在缓存里，每次 make 新建，mtime = 现在 → .prepared 被判过期 →
      #   toolchain/compile 跟着被判过期 → 明明「缓存已存在」还是重编 26 分钟。
      # 这里不推未来，Toolchain Builder 自己就会出现「need_build=false 但很慢」。
      if: steps.restore.outputs.cache-matched-key != ''
      run: |
        cd /workdir/openwrt
        DIRS="staging_dir/host build_dir/host"
        for d in staging_dir/toolchain-* build_dir/toolchain-*; do [ -d "$d" ] && DIRS="$DIRS $d"; done

        FUT=$(date -d 'now + 6 hours' '+%Y-%m-%d %H:%M:%S')
        echo "戳记统一推到: ${FUT}"

        # 第 1 批：非戳记文件 → 现在
        find $DIRS -type f ! -path '*/stamp/*' ! -name '.built*' ! -name '.configured*' \
          ! -name '.prepared*' ! -name '.installed*' -exec touch -h {} + 2>/dev/null || true

        # 第 2 批：戳记 → 未来同一个绝对时刻（不要分几次 touch，避免微秒差）
        find $DIRS \( -path '*/stamp/*' -o -name '.built*' -o -name '.configured*' \
             -o -name '.prepared*' -o -name '.installed*' \) \
          -exec touch -h -d "$FUT" {} + 2>/dev/null || true

        # staging_dir/.prepared 不在 DIRS 里（DIRS 只有 staging_dir/host/*），单独补
        for f in staging_dir/.prepared staging_dir/host/.prepared; do
          if [ -e "$f" ]; then
            touch -h -d "$FUT" "$f"
            echo "✅ 已推到未来: $f"
          else
            echo "::warning::$f 不存在（tools 大概没编完过）"
          fi
        done

        echo "tools 戳记: $(ls staging_dir/host/stamp/.tools_compile_* 2>/dev/null | wc -l) 个"
        echo "工具链完成戳: $(ls staging_dir/toolchain-*/stamp/.gcc_final_installed 2>/dev/null | wc -l) 个"

    - name: 编译工具链
      id: build
      if: steps.check.outputs.need_build == 'true'
      run: |
        cd /workdir/openwrt
        echo "开始编译 tools/ + toolchain/（$(nproc) 线程）"
        START=$(date +%s)
        # 只编 tools 和工具链，不碰 package / target / 固件
        make -j"$(nproc)" toolchain/compile || make -j1 toolchain/compile || make -j1 V=s toolchain/compile
        END=$(date +%s)
        echo "编译耗时: $(( END - START )) 秒"
        echo "elapsed=$(( END - START ))" >> "$GITHUB_OUTPUT"

        echo "--- 检查完成戳 ---"
        STAMP=$(ls staging_dir/toolchain-*/stamp/.gcc_final_installed 2>/dev/null || true)
        if [ -z "$STAMP" ]; then
          echo "::error::没找到 .gcc_final_installed，工具链可能没编完整，不保存缓存"
          exit 1
        fi
        echo "✅ 完成戳: $STAMP"
        ls -d staging_dir/toolchain-* build_dir/toolchain-* build_dir/host 2>/dev/null || true

    - name: 保存工具链缓存
      id: save
      # ⚠ 不能写成 `steps.build.outcome == 'success'`：
      #   「检查是否已有缓存」判定命中时 steps.build 是 skipped，条件恒为 false，
      #   于是这个 workflow 就变成「查完说有缓存、然后什么都不做」——
      #   而那个缓存是固件构建顺手存的（它只存 staging_dir，没有 build_dir）。
      #   这里要的是「本次结束时工作区里确实有完整工具链」就存。
      if: >-
        success()
        && steps.build.outcome != 'failure'
        && (steps.build.outcome == 'success' || steps.restore.outputs.cache-hit == 'true')
      uses: actions/cache/save@v5
      with:
        # 四块缺一不可：
        #   stamp 在 toolchain-*/ 和 host/stamp/ 里；
        #   而没有 build_dir/host 的话，固件构建会重编全部 tools（19.9 min），
        #   进而刷新 tools stamp、把工具链也拖着重编（26.2 min）。
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/toolchain-*
          /workdir/openwrt/build_dir/host
        key: toolchain-v3-${{ steps.tc.outputs.fingerprint }}

    - name: 结果汇总
      if: always()
      run: |
        {
          echo "## 工具链编译结果"
          echo ""
          echo "| 项目 | 值 |"
          echo "|---|---|"
          echo "| 指纹 | \`${{ steps.tc.outputs.fingerprint }}\` |"
          echo "| 基准 SoC | \`${SOC}\` |"
          if [ "${{ steps.check.outputs.need_build }}" = "true" ]; then
            echo "| 是否重新编译 | 是 |"
            echo "| 编译耗时 | ${{ steps.build.outputs.elapsed }} 秒 |"
          else
            echo "| 是否重新编译 | 否（缓存已存在） |"
          fi
          # 缓存到底存下了没有 —— 之前这里静默跳过，看板上一片绿但什么都没存
          if [ "${{ steps.save.outcome }}" = "success" ]; then
            echo "| 缓存 | 本次已写入 \`${{ steps.tc.outputs.fingerprint }}\` |"
          elif [ "${{ steps.save.outcome }}" = "skipped" ]; then
            echo "| 缓存 | ⚠ 被跳过（见 build 步骤结果） |"
          else
            echo "| 缓存 | ❌ 保存失败：${{ steps.save.outcome }} |"
          fi
          echo ""
          echo "> 固件构建（PonWrt Builder）会在 \`reuse_toolchain=true\` 时自动命中这个缓存。"
        } >> "$GITHUB_STEP_SUMMARY"
